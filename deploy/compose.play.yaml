name: tunes-play
services:
  tunes-play:
    build:
      context: ..
      args:
        BUILD_REVISION: ${BUILD_REVISION:?Set BUILD_REVISION to the checked out Git commit}
        VITE_BASE_PATH: /play/
    networks:
      - proxy
    volumes:
      - play-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => r.json()).then(h => process.exit(h.status === 'ok' && h.revision === process.env.BUILD_REVISION ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
networks:
  proxy:
    external: true
    name: ${TUNES_CADDY_NETWORK:?Select the existing private Docker network shared by the Tunes app and Caddy}
volumes:
  play-data:
