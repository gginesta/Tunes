<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Return to your Tunes room</title>
</head>
<body>
  <main>
    <h1>Return to your Tunes room</h1>
    <p id="status" role="status">Completing Spotify sign-in…</p>
    <a href="/">Open Tunes</a>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    window.history.replaceState(null, '', window.location.pathname);
    if (window.opener && params.get('state')) {
      window.opener.postMessage({type:'tunes:spotify:code', state:params.get('state'),
        code:params.get('code'), error:params.get('error')}, window.location.origin);
      document.getElementById('status').textContent = 'Return to the Tunes tab where you started signing in.';
    } else {
      document.getElementById('status').textContent = 'Open your saved room and choose Connect Spotify to try again.';
    }
  </script>
</body>
</html>
